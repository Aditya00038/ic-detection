<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e0e0ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #999;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            margin: 20px auto;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-area {
            margin-top: 30px;
            display: none;
        }
        
        .result-area.show {
            display: block;
        }
        
        .result-image {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .result-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .result-count {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .detection-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .detection-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .detection-item strong {
            color: #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 IC Detection System</h1>
        <p class="subtitle">Upload an image to detect Integrated Circuits</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Click to upload or drag & drop</div>
            <div class="upload-hint">Supports: JPG, PNG, JPEG</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <button class="btn" id="detectBtn" disabled>🔍 Detect ICs</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing image... Please wait</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-area" id="resultArea">
            <h2 style="color: #667eea; margin-bottom: 20px;">📊 Detection Results</h2>
            <img id="resultImage" class="result-image">
            <div class="result-info">
                <div class="result-count" id="resultCount"></div>
                <div class="detection-list" id="detectionList"></div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const detectBtn = document.getElementById('detectBtn');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const resultImage = document.getElementById('resultImage');
        const resultCount = document.getElementById('resultCount');
        const detectionList = document.getElementById('detectionList');
        const errorDiv = document.getElementById('error');
        
        let selectedFile = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        // File selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            selectedFile = file;
            detectBtn.disabled = false;
            uploadArea.innerHTML = `
                <div class="upload-icon">✅</div>
                <div class="upload-text">File selected: ${file.name}</div>
                <div class="upload-hint">Click "Detect ICs" to analyze</div>
            `;
        }
        
        // Detect button
        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            // Hide previous results
            resultArea.classList.remove('show');
            errorDiv.classList.remove('show');
            loading.classList.add('show');
            detectBtn.disabled = true;
            
            // Create form data
            const formData = new FormData();
            formData.append('image', selectedFile);
            
            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Show results
                    resultImage.src = data.image;
                    resultCount.innerHTML = `🎯 Found <strong>${data.count}</strong> IC chip(s)`;
                    
                    // Show detection list
                    detectionList.innerHTML = data.detections.map((det, idx) => `
                        <div class="detection-item">
                            <strong>IC ${idx + 1}</strong><br>
                            Confidence: ${det.confidence}%<br>
                            Size: ${det.width}×${det.height}px
                        </div>
                    `).join('');
                    
                    resultArea.classList.add('show');
                } else {
                    throw new Error(data.error || 'Detection failed');
                }
            } catch (error) {
                errorDiv.textContent = '❌ Error: ' + error.message;
                errorDiv.classList.add('show');
            } finally {
                loading.classList.remove('show');
                detectBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
